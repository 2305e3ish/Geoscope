services:
  - type: web
    name: earthdata-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app -b 0.0.0.0:$PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CMR_CLIENT_ID
        value: "GeoScope"
      - key: USER_AGENT
        value: "GeoScope/1.0 (contact@example.com)"
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: "all-MiniLM-L6-v2"
      - key: RAG_TOP_K
        value: "5"
